# jobs.example.yaml — copy to jobs.yaml (gitignored) and fill in.
#
#   python -m apply.batch jobs.yaml --plan      inspect the whole list, fill nothing
#   python -m apply.batch jobs.yaml --dry-run   fill everything, submit nothing
#   python -m apply.batch jobs.yaml             SUBMIT
#
# `company` and `role` are required, not decoration: they feed the TEMPLATE
# answers, and a form asking "why this company" parks without them rather than
# rendering a blank clause.
#
# `resume` is optional:
#   a path      this job gets that file (relative paths resolve from this file)
#   generic     explicitly the answer bank's resume_path
#   omitted     same as generic
# A résumé is never matched to a posting by keyword — you choose.

- url: https://boards.greenhouse.io/example/jobs/1234567
  company: Example Corp
  role: Senior Frontend Engineer
  resume: variants/frontend.pdf

- url: https://jobs.lever.co/example-two/89abcdef
  company: Example Two
  role: Staff Engineer
  resume: generic

- url: https://careers.example-three.com/apply/42
  company: Example Three
  role: Frontend Engineer
