<!doctype html><title>Apply — Staff Engineer</title>
<form method="get" action="thanks.html">
  <label>Email *<input type="email" name="email" required></label>
  <label for="sal">Expected salary (LPA) *</label>
  <input id="sal" name="expected_salary" type="number" min="0" required>
  <label for="np">Notice period</label>
  <select id="np" name="notice"><option value="">Select…</option>
    <option>30 days</option><option>60 days</option><option>90 days</option></select>
  <button type="submit">Submit application</button>
</form>
